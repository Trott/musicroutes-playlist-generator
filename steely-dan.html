<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Like Six Degrees of Kevin Bacon but for music. Sort of.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Six Degrees of Steely Dan</title>
    <link rel="stylesheet" href="styles/main.css">

    <meta property="og:title" content="Six Degrees of Steely Dan" />
    <meta property="og:site_name" content="Six Degrees of Steely Dan" />
    <meta property="og:image" content="http://musicroutes.com/images/og.png" />
    <meta property="fb:app_id" content="147311265342826" />
</head>
<body>
    <header class="app-bar promote-layer">
      <div class="app-bar-container">
        <h1 class="logo"><a href="//musicroutes.com"><img src="images/logo.png" alt="Music Routes"></a> Six Degrees of Steely Dan</h1>
      </div>
    </header>
    <main>
        <p>Enter the name of a musician to connect to Steely Dan.</p>
        <form action="https://music-routing-rich-trotts-projects.vercel.app/go">
            <div><label>Musician:</label></div><input autofocus="" name="start">
            <input id="end" type="hidden" name="end" value="">
            <div><input type="submit"></div>
        </form>
    </main>
    <script>document.getElementById("end").value = Math.random() < 0.5 ? "Walter Becker" : "Donald Fagen";</script>
</body>
</html>
